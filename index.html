<!DOCTYPE html>
<html>
<head>
  <title>King Clicker</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #111;
      color: white;
    }

    #carta {
      width: 250px;
      cursor: pointer;
      transition: transform 0.1s;
      border-radius: 10px;
    }

    #carta:active {
      transform: scale(0.9);
    }

    button {
      margin-top: 15px;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>🃏 King Clicker</h1>

<p>Pontos: <span id="pontos">0</span></p>

<!-- COLE SUA IMAGEM AQUI -->
<img id="carta" src="SUA_IMAGEM_AQUI.png" onclick="clicar()">

<br>

<button onclick="upgrade()">Upgrade (+1 por clique)</button>

<script>
  let pontos = 0;
  let valorClique = 1;
  let custo = 10;

  function clicar() {
    pontos += valorClique;
    atualizar();
  }

  function upgrade() {
    if (pontos >= custo) {
      pontos -= custo;
      valorClique++;
      custo *= 2;
      atualizar();
    }
  }

  function atualizar() {
    document.getElementById("pontos").innerText = pontos;
  }
</script>

</body>
</html>
